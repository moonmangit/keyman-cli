name: CI

# Every pull request, and every merge to main (the release workflow calls this
# one before it builds anything). A run that fails blocks the release.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  cli-lint:
    name: CLI · format and lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: rustup update stable && rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings

  cli-test:
    name: CLI · tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macos-15-intel: the macOS arm64 runners have long queues (capacity limits).
        os: [ubuntu-24.04, macos-15-intel, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup update stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - name: Shell completion
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cargo build --locked
          scripts/check-completions.sh target/debug/keyman

  cloud-e2e:
    name: Cloud · end-to-end and database tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # The local stack signs test users in with a password; the hosted project does not.
      SUPABASE_AUTH_EMAIL_ENABLED: 'true'
      # Placeholders so the stack starts; no test signs in with these providers.
      SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: ci-placeholder
      SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET: ci-placeholder
      SUPABASE_AUTH_EXTERNAL_GITHUB_CLIENT_ID: ci-placeholder
      SUPABASE_AUTH_EXTERNAL_GITHUB_SECRET: ci-placeholder
    steps:
      - uses: actions/checkout@v7
      - run: rustup update stable
      - uses: Swatinem/rust-cache@v2
      # An exact version: "latest" asks the GitHub API each run and fails at its rate limit.
      - uses: supabase/setup-cli@v1
        with:
          version: 3.2.0
      - name: Start the local Supabase stack
        run: supabase start
      - name: Database tests
        run: supabase test db
      - name: Cloud end-to-end tests
        run: |
          set -a; eval "$(supabase status -o env)"; set +a
          KEYMAN_E2E=1 cargo test --locked --test cloud_e2e -- --ignored --test-threads=1
      - name: Stop the stack
        if: always()
        run: supabase stop --no-backup

  # Lint and test only: the release workflow builds the app bundles.
  app:
    name: App · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, windows-2022]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: gui
    steps:
      - uses: actions/checkout@v7
      - run: rustup update stable && rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gui
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
