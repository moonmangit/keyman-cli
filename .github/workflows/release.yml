name: Build and release

# Every merge to main runs the full CI and, at the same time, builds the CLI and the
# desktop app for Windows and macOS. When the version in Cargo.toml has no tag yet,
# the same run releases, but only after CI and every build pass: it tags the merged
# commit, creates the GitHub release from CHANGELOG.md (with the app zips and
# SHA256SUMS.txt, which the app's updater reads), and publishes to npm. So releasing
# is: bump the version (Cargo.toml, gui/Cargo.toml, npm/package.json), add its
# changelog section, merge. Pushing a vX.Y.Z tag by hand still works too.
#
# The npm trusted publisher is tied to this file's name: keep it release.yml.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan the release
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.plan.outputs.version }}
      release: ${{ steps.plan.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: plan
        name: Check versions and decide whether to release
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          app_version=$(sed -n 's/^version = "\(.*\)"/\1/p' gui/Cargo.toml | head -1)
          npm_version=$(node -p "require('./npm/package.json').version")
          if [[ "$version" != "$npm_version" || "$version" != "$app_version" ]]; then
            echo "::error::Cargo.toml has $version, gui/Cargo.toml has $app_version and npm/package.json has $npm_version. Set all three to the same version."
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match version $version"
              exit 1
            fi
            release=true
          elif [[ "$GITHUB_REF" == refs/heads/main ]] && ! git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            release=true
          else
            release=false
          fi
          if [[ "$release" == true ]] && ! grep -qx "## $version" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## $version' section. Add the release notes before releasing."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          if [[ "$release" == true ]]; then
            echo "### Releasing v$version" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### v$version is already released: testing and packaging only" >> "$GITHUB_STEP_SUMMARY"
          fi

  ci:
    name: CI
    needs: plan
    uses: ./.github/workflows/ci.yml

  # Starts with CI, not after it. The release jobs below wait for both.
  build:
    name: Build · ${{ matrix.name }}
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2022
            target: x86_64-pc-windows-msvc
            app: Keyman-windows-x64.zip
          - name: macOS Apple silicon
            os: macos-15
            target: aarch64-apple-darwin
            app: Keyman-macos-arm64.zip
          - name: macOS Intel
            # Built on the faster Apple silicon runners, for the Intel target.
            os: macos-15
            target: x86_64-apple-darwin
            app: Keyman-macos-x64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup update stable && rustup target add ${{ matrix.target }}
      - name: App toolchain target
        working-directory: gui
        run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          workspaces: |
            . -> target
            gui -> target
      - name: CLI
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: App (Windows)
        if: runner.os == 'Windows'
        working-directory: gui
        shell: pwsh
        run: |
          cargo build --locked --release --target ${{ matrix.target }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/${{ matrix.target }}/release/keyman-app.exe dist/Keyman.exe
          Compress-Archive -Path dist/Keyman.exe -DestinationPath ${{ matrix.app }}
      - name: App (macOS)
        if: runner.os == 'macOS'
        working-directory: gui
        run: |
          scripts/bundle-macos.sh --target ${{ matrix.target }}
          ditto -c -k --keepParent target/release/bundle/Keyman.app ${{ matrix.app }}
      - uses: actions/upload-artifact@v6
        with:
          name: cli-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/keyman${{ runner.os == 'Windows' && '.exe' || '' }}
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        with:
          name: app-${{ matrix.target }}
          path: gui/${{ matrix.app }}
          if-no-files-found: error

  package:
    needs: [plan, build]
    # Apple silicon: the smoke test runs the macOS arm64 binary.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: cli-*
          path: native
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify and package npm release
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./npm/package.json').version")" = "${{ needs.plan.outputs.version }}"
          for dir in native/cli-*; do
            target="${dir#native/cli-}"
            mkdir -p "npm/bin/native/$target"
            cp "$dir"/* "npm/bin/native/$target/"
          done
          test -f npm/bin/native/x86_64-pc-windows-msvc/keyman.exe
          test -f npm/bin/native/x86_64-apple-darwin/keyman
          test -f npm/bin/native/aarch64-apple-darwin/keyman
          chmod +x npm/bin/native/*/keyman
          mkdir -p dist
          npm pack ./npm --pack-destination dist
          mkdir -p "$RUNNER_TEMP/keyman-home" "$RUNNER_TEMP/keyman-project"
          npm install --prefix "$RUNNER_TEMP/keyman-install" ./dist/*.tgz
          printf 'smoke:\n  KEY: "ok"\n  staging:\n    STAGE: "s"\n' > "$RUNNER_TEMP/keyman-master.yml"
          keyman="$RUNNER_TEMP/keyman-install/node_modules/.bin/keyman"
          HOME="$RUNNER_TEMP/keyman-home" "$keyman" --version | grep -F "${{ needs.plan.outputs.version }}"
          HOME="$RUNNER_TEMP/keyman-home" "$keyman" load "$RUNNER_TEMP/keyman-master.yml"
          HOME="$RUNNER_TEMP/keyman-home" "$keyman" inject smoke:staging "$RUNNER_TEMP/keyman-project"
          grep -Fx 'KEY="ok"' "$RUNNER_TEMP/keyman-project/.env"
          grep -Fx 'STAGE="s"' "$RUNNER_TEMP/keyman-project/.env"
      - uses: actions/upload-artifact@v6
        with:
          name: npm-package
          path: dist/*.tgz
          if-no-files-found: error

  windows-package-smoke:
    needs: package
    runs-on: windows-2022
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: npm-package
          path: dist
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install and run the npm command
        shell: pwsh
        run: |
          $installRoot = Join-Path $env:RUNNER_TEMP 'keyman-install'
          $packagePath = (Get-ChildItem -Path dist -Filter '*.tgz' | Select-Object -First 1).FullName
          npm install --prefix $installRoot $packagePath
          if ($LASTEXITCODE -ne 0) { throw 'npm install failed' }
          $project = Join-Path $env:RUNNER_TEMP 'keyman-project'
          New-Item -ItemType Directory -Path $project | Out-Null
          $master = Join-Path $env:RUNNER_TEMP 'keyman-master.yml'
          [System.IO.File]::WriteAllText($master, "smoke:`n  KEY: `"ok`"`n")
          $command = Join-Path $installRoot 'node_modules/.bin/keyman.cmd'
          & $command load $master
          if ($LASTEXITCODE -ne 0) { throw 'keyman load failed' }
          & $command inject smoke $project
          if ($LASTEXITCODE -ne 0) { throw 'keyman inject failed' }
          if ((Get-Content -LiteralPath (Join-Path $project '.env') -Raw) -notmatch 'KEY="ok"') {
            throw 'The .env contents did not match'
          }

  github-release:
    if: needs.plan.outputs.release == 'true'
    needs: [plan, ci, package, windows-package-smoke]
    runs-on: ubuntu-24.04
    # Add required reviewers to the "release" environment (Settings › Environments)
    # to approve each release by hand before anything is tagged or published.
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: npm-package
          path: dist
      - uses: actions/download-artifact@v8
        with:
          pattern: cli-*
          path: dist/native
      - uses: actions/download-artifact@v8
        with:
          pattern: app-*
          path: dist/assets
          merge-multiple: true
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          # The changelog section for this version, without its heading.
          awk -v heading="## $VERSION" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          for binary_dir in dist/native/cli-*; do
            target="${binary_dir#dist/native/cli-}"
            if test -f "$binary_dir/keyman.exe"; then
              cp "$binary_dir/keyman.exe" "dist/assets/keyman-$target.exe"
            else
              cp "$binary_dir/keyman" "dist/assets/keyman-$target"
            fi
          done
          # The app's updater checks each download against this file.
          (cd dist/assets && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/*.tgz dist/assets/* --clobber
          else
            # Tags the merged commit when the tag does not exist yet.
            gh release create "$tag" dist/*.tgz dist/assets/* \
              --target "$GITHUB_SHA" --title "Keyman $VERSION" --notes-file notes.md
          fi

  npm-publish:
    if: needs.plan.outputs.release == 'true'
    needs: [plan, package, github-release]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: npm-package
          path: dist
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Publish with npm trusted publishing
        shell: bash
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          if npm view "keyman-cli@$VERSION" version >/dev/null 2>&1; then
            echo "keyman-cli@$VERSION is already published"
          else
            npm publish ./dist/*.tgz --access public
          fi
