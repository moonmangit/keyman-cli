name: Build and release

# Every merge to main builds the CLI and the desktop app for Windows x64 and macOS Apple silicon. (It
# does not run CI again: the pull request already passed it. A tag push or a manual
# run does run CI.) When the version in Cargo.toml has no tag yet, the same run
# releases, but only after every build (and CI, when it runs) passes: it tags the merged
# commit, creates the GitHub release from CHANGELOG.md (with the app zips and
# SHA256SUMS.txt, which the app's updater reads), and publishes to npm. So releasing
# is: bump the version (Cargo.toml, gui/Cargo.toml, npm/package.json), add its
# changelog section, merge. Pushing a vX.Y.Z tag by hand still works too.
#
# The npm trusted publisher is tied to this file's name: keep it release.yml.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan the release
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.plan.outputs.version }}
      release: ${{ steps.plan.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: plan
        name: Check versions and decide whether to release
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          app_version=$(sed -n 's/^version = "\(.*\)"/\1/p' gui/Cargo.toml | head -1)
          npm_version=$(node -p "require('./npm/package.json').version")
          if [[ "$version" != "$npm_version" || "$version" != "$app_version" ]]; then
            echo "::error::Cargo.toml has $version, gui/Cargo.toml has $app_version and npm/package.json has $npm_version. Set all three to the same version."
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match version $version"
              exit 1
            fi
            release=true
          elif [[ "$GITHUB_REF" == refs/heads/main ]] && ! git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            release=true
          else
            release=false
          fi
          if [[ "$release" == true ]] && ! grep -qx "## $version" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## $version' section. Add the release notes before releasing."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          if [[ "$release" == true ]]; then
            echo "### Releasing v$version" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### v$version is already released: testing and packaging only" >> "$GITHUB_STEP_SUMMARY"
          fi

  # A merge to main skips CI: the pull request already passed the same CI. (Set
  # "Require status checks to pass" on main, so that no merge skips it.) A tag push
  # or a manual run still runs CI first.
  ci:
    name: CI
    needs: plan
    if: github.ref != 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  # Two build jobs only, one of them on macOS: GitHub has few macOS runners, and each
  # more macOS job can wait in its queue.
  build:
    name: Build · ${{ matrix.name }}
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2022
          - name: macOS Apple silicon
            # Apple silicon: about 4 times faster than the Intel runners, which also
            # wait in a queue. One macOS job only, because macOS runners are few.
            os: macos-15
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup update stable
      # The same key on every run of a job, so each run starts from the cache that the
      # last run on main saved. Only main and tags save it.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ runner.os }}
          save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}
          workspaces: |
            . -> target
            gui -> target
      - name: CLI and app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --locked --release --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location gui
          cargo build --locked --release --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          New-Item -ItemType Directory dist/cli-x86_64-pc-windows-msvc, dist/app | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/keyman.exe dist/cli-x86_64-pc-windows-msvc/
          Copy-Item gui/target/x86_64-pc-windows-msvc/release/keyman-app.exe dist/app/Keyman.exe
          Compress-Archive -Path dist/app/Keyman.exe -DestinationPath dist/app/Keyman-windows-x64.zip
          Remove-Item dist/app/Keyman.exe
      - name: CLI and app (macOS)
        if: runner.os == 'macOS'
        run: |
          # Apple silicon only: Intel Macs are not built for now.
          cargo build --locked --release --target aarch64-apple-darwin
          mkdir -p dist/cli-aarch64-apple-darwin
          cp target/aarch64-apple-darwin/release/keyman dist/cli-aarch64-apple-darwin/
          (cd gui && scripts/bundle-macos.sh --target aarch64-apple-darwin)
          mkdir -p dist/app
          ditto -c -k --keepParent gui/target/release/bundle/Keyman.app dist/app/Keyman-macos-arm64.zip
      - uses: actions/upload-artifact@v6
        with:
          name: build-${{ runner.os }}
          path: dist/
          if-no-files-found: error

  # Packs the npm package and runs it, on Windows (no macOS runner to wait for).
  package:
    needs: [plan, build]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: build-*
          path: built
          merge-multiple: true
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify and pack
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./npm/package.json').version")" = "${{ needs.plan.outputs.version }}"
          for dir in built/cli-*; do
            target="${dir#built/cli-}"
            mkdir -p "npm/bin/native/$target"
            cp "$dir"/* "npm/bin/native/$target/"
          done
          test -f npm/bin/native/x86_64-pc-windows-msvc/keyman.exe
          test -f npm/bin/native/aarch64-apple-darwin/keyman
          test -f built/app/Keyman-windows-x64.zip
          test -f built/app/Keyman-macos-arm64.zip
          mkdir -p dist
          npm pack ./npm --pack-destination dist
      - name: Install and run the npm command
        shell: pwsh
        run: |
          $installRoot = Join-Path $env:RUNNER_TEMP 'keyman-install'
          $packagePath = (Get-ChildItem -Path dist -Filter '*.tgz' | Select-Object -First 1).FullName
          npm install --prefix $installRoot $packagePath
          if ($LASTEXITCODE -ne 0) { throw 'npm install failed' }
          $command = Join-Path $installRoot 'node_modules/.bin/keyman.cmd'
          $version = & $command --version
          if ($version -notmatch [regex]::Escape('${{ needs.plan.outputs.version }}')) { throw "keyman --version said $version" }
          $project = Join-Path $env:RUNNER_TEMP 'keyman-project'
          New-Item -ItemType Directory -Path $project | Out-Null
          $master = Join-Path $env:RUNNER_TEMP 'keyman-master.yml'
          [System.IO.File]::WriteAllText($master, "smoke:`n  KEY: `"ok`"`n  staging:`n    STAGE: `"s`"`n")
          & $command load $master
          if ($LASTEXITCODE -ne 0) { throw 'keyman load failed' }
          & $command inject smoke:staging $project
          if ($LASTEXITCODE -ne 0) { throw 'keyman inject failed' }
          $env_text = Get-Content -LiteralPath (Join-Path $project '.env') -Raw
          if ($env_text -notmatch 'KEY="ok"' -or $env_text -notmatch 'STAGE="s"') {
            throw 'The .env contents did not match'
          }
      - uses: actions/upload-artifact@v6
        with:
          name: npm-package
          path: dist/*.tgz
          if-no-files-found: error

  github-release:
    # Runs when CI passed or was skipped (a merge to main), never after a failure.
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.release == 'true' }}
    needs: [plan, ci, package]
    runs-on: ubuntu-24.04
    # Add required reviewers to the "release" environment (Settings › Environments)
    # to approve each release by hand before anything is tagged or published.
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: npm-package
          path: dist
      - uses: actions/download-artifact@v8
        with:
          pattern: build-*
          path: dist/built
          merge-multiple: true
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          # The changelog section for this version, without its heading.
          awk -v heading="## $VERSION" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          mkdir -p dist/assets
          cp dist/built/app/* dist/assets/
          for binary_dir in dist/built/cli-*; do
            target="${binary_dir#dist/built/cli-}"
            if test -f "$binary_dir/keyman.exe"; then
              cp "$binary_dir/keyman.exe" "dist/assets/keyman-$target.exe"
            else
              cp "$binary_dir/keyman" "dist/assets/keyman-$target"
            fi
          done
          # The app's updater checks each download against this file.
          (cd dist/assets && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/*.tgz dist/assets/* --clobber
          else
            # Tags the merged commit when the tag does not exist yet.
            gh release create "$tag" dist/*.tgz dist/assets/* \
              --target "$GITHUB_SHA" --title "Keyman $VERSION" --notes-file notes.md
          fi

  npm-publish:
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.release == 'true' }}
    needs: [plan, package, github-release]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: npm-package
          path: dist
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Publish with npm trusted publishing
        shell: bash
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          if npm view "keyman-cli@$VERSION" version >/dev/null 2>&1; then
            echo "keyman-cli@$VERSION is already published"
          else
            npm publish ./dist/*.tgz --access public
          fi
