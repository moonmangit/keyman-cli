name: Release

# Builds Keyman for Windows x64 and publishes it as a GitHub release, like Sigit.
# To release: set the same version in Cargo.toml, gui/Cargo.toml and npm/package.json,
# add its "## X.Y.Z" section to CHANGELOG.md, merge, then push the tag:
#   git tag v0.3.2 && git push origin v0.3.2
# A merge to main, or a manual run (Actions › Release › Run workflow), builds everything
# without publishing. macOS and Linux build from source for now.
#
# The npm trusted publisher is tied to this file's name: keep it release.yml.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build · Windows x64
    runs-on: windows-2022
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - id: version
        name: Check the versions (and the tag and changelog on a release)
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          app_version=$(sed -n 's/^version = "\(.*\)"/\1/p' gui/Cargo.toml | head -1)
          npm_version=$(node -p "require('./npm/package.json').version")
          if [[ "$version" != "$npm_version" || "$version" != "$app_version" ]]; then
            echo "::error::Cargo.toml has $version, gui/Cargo.toml has $app_version and npm/package.json has $npm_version. Set all three to the same version."
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
              echo "::error::The tag $GITHUB_REF_NAME does not agree with the version $version."
              exit 1
            fi
            if ! grep -qx "## $version" CHANGELOG.md; then
              echo "::error::CHANGELOG.md has no '## $version' section."
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - run: rustup update stable
      # The same key on every run, so each run starts from the cache that the last run on
      # main or a tag saved.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-Windows
          save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}
          workspaces: |
            . -> target
            gui -> target

      - name: Build the CLI and the app
        shell: pwsh
        run: |
          cargo build --locked --release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location gui
          cargo build --locked --release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location

      - name: Package the CLI and the app zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist, dist/app | Out-Null
          Copy-Item target/release/keyman.exe dist/keyman-x86_64-pc-windows-msvc.exe
          Copy-Item gui/target/release/keyman-app.exe dist/app/Keyman.exe
          # The app's updater downloads this zip.
          Compress-Archive -Path dist/app/Keyman.exe -DestinationPath dist/Keyman-windows-x64.zip
          Remove-Item -Recurse dist/app

      - name: Installer
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          $exe = (Resolve-Path gui/target/release/keyman-app.exe).Path
          & $iscc /Q "/DAppVersion=${{ steps.version.outputs.version }}" "/DSourceExe=$exe" "/O$((Resolve-Path dist).Path)" installer/windows/keyman.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist/Keyman-setup-windows-x64.exe

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Pack and smoke test the npm package
        shell: pwsh
        run: |
          New-Item -ItemType Directory npm/bin/native/x86_64-pc-windows-msvc -Force | Out-Null
          Copy-Item target/release/keyman.exe npm/bin/native/x86_64-pc-windows-msvc/keyman.exe
          npm pack ./npm --pack-destination dist
          if ($LASTEXITCODE -ne 0) { throw 'npm pack failed' }
          $installRoot = Join-Path $env:RUNNER_TEMP 'keyman-install'
          $packagePath = (Get-ChildItem -Path dist -Filter '*.tgz' | Select-Object -First 1).FullName
          npm install --prefix $installRoot $packagePath
          if ($LASTEXITCODE -ne 0) { throw 'npm install failed' }
          $command = Join-Path $installRoot 'node_modules/.bin/keyman.cmd'
          $said = & $command --version
          if ($said -notmatch [regex]::Escape('${{ steps.version.outputs.version }}')) { throw "keyman --version said $said" }
          $project = Join-Path $env:RUNNER_TEMP 'keyman-project'
          New-Item -ItemType Directory -Path $project | Out-Null
          $master = Join-Path $env:RUNNER_TEMP 'keyman-master.yml'
          [System.IO.File]::WriteAllText($master, "smoke:`n  KEY: `"ok`"`n  staging:`n    STAGE: `"s`"`n")
          & $command load $master
          if ($LASTEXITCODE -ne 0) { throw 'keyman load failed' }
          & $command inject smoke:staging $project
          if ($LASTEXITCODE -ne 0) { throw 'keyman inject failed' }
          $text = Get-Content -LiteralPath (Join-Path $project '.env') -Raw
          if ($text -notmatch 'KEY="ok"' -or $text -notmatch 'STAGE="s"') { throw 'The .env contents did not match' }

      - uses: actions/upload-artifact@v6
        with:
          name: release-files
          path: dist/
          if-no-files-found: error

  github-release:
    name: Publish the GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    # Add required reviewers to the "release" environment (Settings › Environments) to
    # approve each release by hand before it is published.
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: release-files
          path: dist
      - name: Checksums and release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          # The changelog section for this version, without its heading.
          awk -v heading="## $VERSION" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          # The app's updater checks each download against this file.
          (cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Keyman $VERSION" --notes-file notes.md

  npm-publish:
    name: Publish to npm
    needs: [build, github-release]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-files
          path: dist
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Publish with npm trusted publishing
        shell: bash
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          if npm view "keyman-cli@$VERSION" version >/dev/null 2>&1; then
            echo "keyman-cli@$VERSION is already published"
          else
            npm publish ./dist/*.tgz --access public
          fi
