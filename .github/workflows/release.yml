name: Build and release

# Every merge to main runs the full CI, then builds and smoke tests the npm package.
# When the version in Cargo.toml has no tag yet, the same run starts the release:
# it tags the merged commit, creates the GitHub release from CHANGELOG.md, and
# publishes to npm. So releasing is: bump the version, add its changelog section,
# merge. Pushing a vX.Y.Z tag by hand still works too.
#
# The npm trusted publisher is tied to this file's name: keep it release.yml.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan the release
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.plan.outputs.version }}
      release: ${{ steps.plan.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: plan
        name: Check versions and decide whether to release
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          npm_version=$(node -p "require('./npm/package.json').version")
          if [[ "$version" != "$npm_version" ]]; then
            echo "::error::Cargo.toml has $version but npm/package.json has $npm_version. Set both to the same version."
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match version $version"
              exit 1
            fi
            release=true
          elif [[ "$GITHUB_REF" == refs/heads/main ]] && ! git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            release=true
          else
            release=false
          fi
          if [[ "$release" == true ]] && ! grep -qx "## $version" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## $version' section. Add the release notes before releasing."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          if [[ "$release" == true ]]; then
            echo "### Releasing v$version" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### v$version is already released: testing and packaging only" >> "$GITHUB_STEP_SUMMARY"
          fi

  ci:
    name: CI
    needs: plan
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            extension: ''
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            extension: ''
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            extension: '.exe'
          - os: macos-15-intel
            target: x86_64-apple-darwin
            extension: ''
          - os: macos-15-intel
            target: aarch64-apple-darwin
            extension: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup update stable
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.target }}
          path: target/${{ matrix.target }}/release/keyman${{ matrix.extension }}
          if-no-files-found: error

  package:
    needs: [plan, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: npm/bin/native
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify and package npm release
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./npm/package.json').version")" = "${{ needs.plan.outputs.version }}"
          test -f npm/bin/native/x86_64-unknown-linux-gnu/keyman
          test -f npm/bin/native/aarch64-unknown-linux-gnu/keyman
          test -f npm/bin/native/x86_64-pc-windows-msvc/keyman.exe
          test -f npm/bin/native/x86_64-apple-darwin/keyman
          test -f npm/bin/native/aarch64-apple-darwin/keyman
          chmod +x npm/bin/native/*/keyman
          mkdir -p dist
          npm pack ./npm --pack-destination dist
          mkdir -p "$RUNNER_TEMP/keyman-home" "$RUNNER_TEMP/keyman-project"
          npm install --prefix "$RUNNER_TEMP/keyman-install" ./dist/*.tgz
          printf 'smoke:\n  KEY: "ok"\n  staging:\n    STAGE: "s"\n' > "$RUNNER_TEMP/keyman-master.yml"
          keyman="$RUNNER_TEMP/keyman-install/node_modules/.bin/keyman"
          HOME="$RUNNER_TEMP/keyman-home" "$keyman" --version | grep -F "${{ needs.plan.outputs.version }}"
          HOME="$RUNNER_TEMP/keyman-home" "$keyman" load "$RUNNER_TEMP/keyman-master.yml"
          HOME="$RUNNER_TEMP/keyman-home" "$keyman" inject smoke:staging "$RUNNER_TEMP/keyman-project"
          grep -Fx 'KEY="ok"' "$RUNNER_TEMP/keyman-project/.env"
          grep -Fx 'STAGE="s"' "$RUNNER_TEMP/keyman-project/.env"
      - uses: actions/upload-artifact@v6
        with:
          name: npm-package
          path: dist/*.tgz
          if-no-files-found: error

  windows-package-smoke:
    needs: package
    runs-on: windows-2022
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: npm-package
          path: dist
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install and run the npm command
        shell: pwsh
        run: |
          $installRoot = Join-Path $env:RUNNER_TEMP 'keyman-install'
          $packagePath = (Get-ChildItem -Path dist -Filter '*.tgz' | Select-Object -First 1).FullName
          npm install --prefix $installRoot $packagePath
          if ($LASTEXITCODE -ne 0) { throw 'npm install failed' }
          $project = Join-Path $env:RUNNER_TEMP 'keyman-project'
          New-Item -ItemType Directory -Path $project | Out-Null
          $master = Join-Path $env:RUNNER_TEMP 'keyman-master.yml'
          [System.IO.File]::WriteAllText($master, "smoke:`n  KEY: `"ok`"`n")
          $command = Join-Path $installRoot 'node_modules/.bin/keyman.cmd'
          & $command load $master
          if ($LASTEXITCODE -ne 0) { throw 'keyman load failed' }
          & $command inject smoke $project
          if ($LASTEXITCODE -ne 0) { throw 'keyman inject failed' }
          if ((Get-Content -LiteralPath (Join-Path $project '.env') -Raw) -notmatch 'KEY="ok"') {
            throw 'The .env contents did not match'
          }

  github-release:
    if: needs.plan.outputs.release == 'true'
    needs: [plan, package, windows-package-smoke]
    runs-on: ubuntu-24.04
    # Add required reviewers to the "release" environment (Settings › Environments)
    # to approve each release by hand before anything is tagged or published.
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: npm-package
          path: dist
      - uses: actions/download-artifact@v8
        with:
          pattern: '*-*-*'
          path: dist/native
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          # The changelog section for this version, without its heading.
          awk -v heading="## $VERSION" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          mkdir -p dist/assets
          for binary_dir in dist/native/*; do
            target="${binary_dir##*/}"
            # The pattern also matches the app artifacts CI uploads; only the CLI is released.
            [[ "$target" == keyman-app-* ]] && continue
            if test -f "$binary_dir/keyman.exe"; then
              cp "$binary_dir/keyman.exe" "dist/assets/keyman-$target.exe"
            else
              cp "$binary_dir/keyman" "dist/assets/keyman-$target"
            fi
          done
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/*.tgz dist/assets/* --clobber
          else
            # Tags the merged commit when the tag does not exist yet.
            gh release create "$tag" dist/*.tgz dist/assets/* \
              --target "$GITHUB_SHA" --title "Keyman $VERSION" --notes-file notes.md
          fi

  npm-publish:
    if: needs.plan.outputs.release == 'true'
    needs: [plan, package, github-release]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: npm-package
          path: dist
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Publish with npm trusted publishing
        shell: bash
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          if npm view "keyman-cli@$VERSION" version >/dev/null 2>&1; then
            echo "keyman-cli@$VERSION is already published"
          else
            npm publish ./dist/*.tgz --access public
          fi
