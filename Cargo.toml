[package]
name = "keyman-cli"
version = "0.2.1"
edition = "2021"
description = "Load project environment variables from a master YAML file"
license = "MIT"

[[bin]]
name = "keyman"
path = "src/main.rs"

[dependencies]
yaml-rust2 = "=0.13.0"
argon2 = "0.5"
chacha20poly1305 = "0.10"
crypto_box = { version = "0.9", features = ["seal"] }
base64 = "0.22"
getrandom = "0.2"
zeroize = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }
sha2 = "0.10"
webbrowser = "1"
